<html>
<head>
<title>Iskalabadodortsing</title>

<style type="text/css">
#d{
	position: absolute;
	width:10px;
	height:10px;
	background-color:#333;
	left:10px;
	top:10px;
}

#b{
	position: absolute;
	width:10px;
	height:10px;
	background-color:#ccc555;
	left:330px;
	top:330px;
}

#bg{
	position: absolute;
	width:800px;
	height:500px;
	left:0px;
	top:0px;
	background-color:#bb66ac;
}

</style>
<script>
var x=0;
var y=0;
var adderX=5;
var adderY=5;

var x2=330;
var y2=330;
var adderX2=-5;
var adderY2=-5;

window.onload=function(){setInterval(function(){go();},10);}
function go(){
	var d=document.getElementById("d");
	x+=adderX;
	y+=adderY;
	
	d.style.left=x;
	d.style.top=y;
	
	if(x>800)adderX*=-1;
	else if(x<0)adderX*=-1;
	if(y>500)adderY*=-1;
	else if(y<0)adderY*=-1;
	
	var b=document.getElementById("b");
	x2+=adderX2;
	y2+=adderY2;
	
	b.style.left=x2;
	b.style.top=y2;
	
	if(x2>800)adderX2*=-1;
	else if(x2<0)adderX2*=-1;
	if(y2>500)adderY2*=-1;
	else if(y2<0)adderY2*=-1;

}

</script>
</head>
<body>
<div id="bg"></div>
<div id="d"></div>
<div id="b"></div>

</body>
</html>
